<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Austin Gravel Ride 2026</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            dark: '#1c1917', // Stone 900
                            green: '#3f6212', // Lime 800
                            earth: '#78350f', // Amber 900
                            light: '#f5f5f4', // Stone 100
                            accent: '#eab308', // Yellow 500
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .hero-pattern {
            background-color: #1c1917;
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%233f6212' fill-opacity='0.15'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        }
        .scroll-smooth {
            scroll-behavior: smooth;
        }
    </style>
</head>
<body class="bg-brand-light text-stone-800 font-sans antialiased scroll-smooth">

    <!-- Navigation -->
    <nav class="fixed w-full z-50 bg-white/90 backdrop-blur-md border-b border-stone-200">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center gap-2">
                    <i data-lucide="bike" class="h-6 w-6 text-brand-green"></i>
                    <span class="font-bold text-xl tracking-tight text-brand-dark">GravelRide<span class="text-brand-green">26</span></span>
                </div>
                <div class="hidden md:flex space-x-8">
                    <a href="#details" class="text-stone-600 hover:text-brand-green transition-colors font-medium">Details</a>
                </div>
                <a href="https://calendar.google.com/calendar/render?action=TEMPLATE&text=Bike+Ride&dates=20261127T093000/20261127T123000&details=Gravel+ride+in+Austin." target="_blank" class="bg-brand-dark text-white px-4 py-2 rounded-full text-sm font-semibold hover:bg-stone-700 transition-colors shadow-lg flex items-center gap-2">
                    <i data-lucide="calendar-plus" class="h-4 w-4"></i>
                    Add to Calendar
                </a>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <header class="relative pt-32 pb-20 lg:pt-48 lg:pb-32 hero-pattern text-white overflow-hidden">
        <div class="absolute inset-0 bg-gradient-to-b from-transparent to-brand-dark/90"></div>
        <div class="relative max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-brand-green/20 border border-brand-green/30 text-brand-accent text-sm font-medium mb-6 backdrop-blur-sm">
                <span class="flex h-2 w-2 rounded-full bg-brand-accent"></span>
                Upcoming Event
            </div>
            <h1 class="text-5xl md:text-7xl font-bold tracking-tight mb-6">
                The Gravel Ride
            </h1>
            <p class="text-xl md:text-2xl text-stone-300 max-w-2xl mx-auto font-light mb-10">
                Join us for a morning adventure through the dirt and gravel of Austin. 
                Dust off your bike and let's ride.
            </p>
            
            <div class="flex flex-col sm:flex-row gap-4 justify-center">
                <div class="flex items-center justify-center gap-3 bg-white/10 backdrop-blur-md px-6 py-4 rounded-xl border border-white/10">
                    <i data-lucide="calendar" class="h-6 w-6 text-brand-accent"></i>
                    <div class="text-left">
                        <p class="text-xs text-stone-400 uppercase tracking-wider">Date</p>
                        <p class="font-semibold">Nov 27th, 2026</p>
                    </div>
                </div>
                <div class="flex items-center justify-center gap-3 bg-white/10 backdrop-blur-md px-6 py-4 rounded-xl border border-white/10">
                    <i data-lucide="clock" class="h-6 w-6 text-brand-accent"></i>
                    <div class="text-left">
                        <p class="text-xs text-stone-400 uppercase tracking-wider">Time</p>
                        <p class="font-semibold">9:30 AM</p>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Quick Stats Grid -->
    <section id="details" class="py-16 bg-white">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="max-w-sm mx-auto -mt-24 relative z-10">
                <!-- Terrain Stat Card -->
                <div class="bg-brand-light p-8 rounded-2xl shadow-xl border-t-4 border-brand-earth transform hover:-translate-y-1 transition-transform duration-300">
                    <div class="h-12 w-12 bg-white rounded-full flex items-center justify-center mb-4 shadow-sm">
                        <i data-lucide="mountain" class="h-6 w-6 text-brand-earth"></i>
                    </div>
                    <h3 class="text-lg font-semibold text-brand-dark mb-2">Terrain</h3>
                    <p class="text-2xl font-bold text-stone-600">Gravel & Dirt</p>
                    <p class="text-sm text-stone-500 mt-2">Mostly unpaved surfaces.</p>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-brand-dark text-stone-400 py-12 border-t border-white/10">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col md:flex-row justify-between items-center gap-6">
            <div class="flex items-center gap-2">
                <i data-lucide="bike" class="h-6 w-6 text-stone-500"></i>
                <span class="font-bold text-lg text-stone-200">GravelRide<span class="text-brand-green">26</span></span>
            </div>
            <p class="text-sm">
                Have fun!
            </p>
        </div>
    </footer>

    <!-- Scripts -->
    <script>
        // Initialize Lucide Icons
        lucide.createIcons();
    </script>
</body>
</html>
